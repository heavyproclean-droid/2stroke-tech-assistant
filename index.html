<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RedMax Tech Assistant</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d32f2f">

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
    background:#f5f5f5;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

h1,h2{
    color:#c62828;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:5px;
    background:#c62828;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#a00000;
}

input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
    box-sizing:border-box;
}

.status{
    color:white;
    padding:10px;
    text-align:center;
    font-weight:bold;
    margin-bottom:15px;
}

.online{
    background:#2e7d32;
}

.offline{
    background:#c62828;
}

#diagnosticResult{
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<div id="connectionStatus" class="status online">
🟢 Online
</div>

<h1>RedMax Tech Assistant</h1>

<button id="installBtn" hidden>
📲 Install App
</button>

<div class="card">
<h2>Guided Diagnostics</h2>

<select id="symptom">
<option value="">Select Symptom</option>
<option value="nostart">Won't Start</option>
<option value="dies">Starts Then Dies</option>
<option value="nospark">No Spark</option>
<option value="overheat">Overheating</option>
</select>

<button onclick="startDiagnosis()">
Begin Diagnosis
</button>

<div id="questions"></div>

<div id="diagnosticResult"></div>
</div>

<div class="card">
<h2>Service Log</h2>

<label>Machine</label>
<input id="machine" placeholder="Enter model">

<label>Repair Notes</label>
<textarea id="notes" rows="5"></textarea>

<button onclick="saveLog()">
Save Log
</button>

<button onclick="exportLogs()">
Export Logs
</button>

<button onclick="backupLogs()">
Backup All Data
</button>

<hr>

<input type="file"
       id="restoreFile"
       accept=".json">

<button onclick="restoreBackup()">
Restore Backup
</button>
</div>

</div>

<script>

/* ==========================
   ONLINE / OFFLINE STATUS
========================== */

function updateConnectionStatus(){

    const status =
    document.getElementById("connectionStatus");

    if(navigator.onLine){

        status.textContent =
        "🟢 Online";

        status.className =
        "status online";

    } else {

        status.textContent =
        "🔴 Offline";

        status.className =
        "status offline";
    }
}

window.addEventListener(
"online",
updateConnectionStatus
);

window.addEventListener(
"offline",
updateConnectionStatus
);

updateConnectionStatus();

/* ==========================
   INSTALL SUPPORT
========================== */

let deferredPrompt;

window.addEventListener(
"beforeinstallprompt",
(e)=>{

    e.preventDefault();

    deferredPrompt = e;

    document.getElementById(
    "installBtn"
    ).hidden = false;
});

document.getElementById(
"installBtn"
).addEventListener(
"click",
async ()=>{

    if(!deferredPrompt) return;

    deferredPrompt.prompt();

    await deferredPrompt.userChoice;

    deferredPrompt = null;

    document.getElementById(
    "installBtn"
    ).hidden = true;
});

/* ==========================
   GUIDED DIAGNOSTICS
========================== */

function startDiagnosis(){

    const symptom =
    document.getElementById(
    "symptom"
    ).value;

    const questions =
    document.getElementById(
    "questions"
    );

    const result =
    document.getElementById(
    "diagnosticResult"
    );

    result.innerHTML = "";

    if(symptom === "nostart"){

        questions.innerHTML = `
        <p>Does the machine have spark?</p>

        <button onclick="sparkAnswer(true)">
        Yes
        </button>

        <button onclick="sparkAnswer(false)">
        No
        </button>
        `;
    }

    else if(symptom === "dies"){

        result.innerHTML =
        "Inspect fuel filter, tank vent, carburetor diaphragm, and fuel lines.";
    }

    else if(symptom === "nospark"){

        result.innerHTML =
        "Inspect spark plug, ignition module, wiring, and stop switch.";
    }

    else if(symptom === "overheat"){

        result.innerHTML =
        "Inspect cooling fins, fuel mixture, carburetor settings, and air flow.";
    }
}

function sparkAnswer(hasSpark){

    if(!hasSpark){

        document.getElementById(
        "questions"
        ).innerHTML = "";

        document.getElementById(
        "diagnosticResult"
        ).innerHTML =
        "Likely ignition problem. Check plug, kill switch, wiring, and ignition coil.";

        return;
    }

    document.getElementById(
    "questions"
    ).innerHTML = `
    <p>Compression Above 120 PSI?</p>

    <button onclick="compressionAnswer(true)">
    Yes
    </button>

    <button onclick="compressionAnswer(false)">
    No
    </button>
    `;
}

function compressionAnswer(good){

    document.getElementById(
    "questions"
    ).innerHTML = "";

    if(!good){

        document.getElementById(
        "diagnosticResult"
        ).innerHTML =
        "Engine problem detected. Inspect piston, rings, cylinder, and crank seals.";

        return;
    }

    document.getElementById(
    "diagnosticResult"
    ).innerHTML =
    "Spark and compression are good. Inspect fuel delivery, carburetor, and filter.";
}

/* ==========================
   SERVICE LOG STORAGE
========================== */

function saveLog(){

    const machine =
    document.getElementById(
    "machine"
    ).value;

    const notes =
    document.getElementById(
    "notes"
    ).value;

    const logs =
    JSON.parse(
    localStorage.getItem(
    "serviceLogs"
    ) || "[]");

    logs.push({

        date:
        new Date()
        .toISOString(),

        machine,
        notes
    });

    localStorage.setItem(
    "serviceLogs",
    JSON.stringify(logs)
    );

    alert("Service Log Saved");
}

/* ==========================
   EXPORT LOGS
========================== */

function exportLogs(){

    const logs =
    JSON.parse(
    localStorage.getItem(
    "serviceLogs"
    ) || "[]"
    );

    const blob =
    new Blob(
    [JSON.stringify(logs,null,2)],
    {type:"application/json"}
    );

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = url;

    a.download =
    "RedMaxServiceLogs.json";

    a.click();
}

/* ==========================
   FULL BACKUP
========================== */

function backupLogs(){

    const backup = {

        exported:
        new Date()
        .toISOString(),

        logs:
        JSON.parse(
        localStorage.getItem(
        "serviceLogs"
        ) || "[]"
        )
    };

    const blob =
    new Blob(
    [JSON.stringify(
    backup,null,2)],
    {type:"application/json"}
    );

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = url;

    a.download =
    "RedMaxBackup.json";

    a.click();
}

/* ==========================
   RESTORE BACKUP
========================== */

function restoreBackup(){

    const file =
    document.getElementById(
    "restoreFile"
    ).files[0];

    if(!file){

        alert("Select a backup file.");
        return;
    }

    const reader =
    new FileReader();

    reader.onload =
    function(){

        const backup =
        JSON.parse(
        reader.result
        );

        localStorage.setItem(
        "serviceLogs",
        JSON.stringify(
        backup.logs || []
        )
        );

        alert(
        "Backup Restored"
        );
    };

    reader.readAsText(
    file
    );
}

/* ==========================
   SERVICE WORKER
========================== */

if("serviceWorker" in navigator){

    navigator.serviceWorker.register(
    "./service-worker.js"
    );
}

</script>

</body>
</html>
